spring.application.name=tripshield
spring.config.import=optional:file:./config/local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tripshield}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

tripshield.coordinator.email=${COORDINATOR_EMAIL:}
tripshield.coordinator.password=${COORDINATOR_PASSWORD:}
tripshield.alert.to=${ALERT_TO:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.error.include-stacktrace=never
