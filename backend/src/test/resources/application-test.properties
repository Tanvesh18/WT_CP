# Integration tests are pinned to the isolated MySQL test schema. Do not parameterize this URL.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/tripshield_test
spring.datasource.username=tripshield_test_app
spring.datasource.password=${tripshield.test.db.password}
spring.config.import=optional:file:./config/test-secrets.properties
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
tripshield.outbox.enabled=false
spring.jpa.open-in-view=false
spring.mail.host=127.0.0.1
spring.mail.port=2525
spring.mail.username=tripshield-test-sender@example.test
spring.mail.password=test-only
tripshield.alert.to=tripshield-test-alert@example.test
tripshield.coordinator.email=coordinator@tripshield.test
tripshield.coordinator.password=integration-test-coordinator-password
tripshield.duffel.token=duffel_test_mock_only
server.error.include-stacktrace=never
